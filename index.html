          React.createElement("div",{className:"text-[11px] text-[#7a8aa6]"},"Slide to tune ±10 kHz • tap ± for fine"),
          React.createElement("div",{className:"flex items-center gap-2 mt-1"},
            React.createElement("button",{onClick:()=>setFineTune(v=>Math.max(-10000,v-100)),className:"w-8 h-8 rounded-full bg-[#0b1018] border border-[#1e293b] text-white hover:bg-[#1e293b]"},"−"),
            React.createElement("input",{type:"range",min:-10000,max:10000,step:10,value:fineTune,onChange:e=>setFineTune(parseInt(e.target.value)),className:"flex-1 accent-[#22c55e]"}),

            ))
          )
        )

      // RIGHT CHAT - DYNAMIC
      React.createElement("div",{className:"rounded-[14px] bg-[#111827]/70 border border-[#1e293b] p-4 flex flex-col"},
        React.createElement("div",{className:"flex justify-between items-center"},
          React.createElement("h2",{className:"text-[11px] tracking-[0.18em] text-[#7a8aa6] font-bold"},"ROOM CHAT • "+currentRoom.name.toUpperCase()),
          React.createElement("div",{className:"w-2 h-2 rounded-full bg-[#22c55e] shadow-[0_0_8px_#22c55e]"})
        ),
        React.createElement("div",{className:"mt-4 p-3 rounded-[12px] bg-[#0f172a] border border-[#1e293b]"},

          ),
          React.createElement("div",{className:"text-[12px] text-[#7a8aa6] mt-1 leading-snug"},currentRoom.desc),
          React.createElement("div",{className:"mt-2 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#0d1f15] border border-[#1a3a26] text-[11px] text-[#4ade80]"},"● 0 operators")
        ),
        React.createElement("div",{className:"mt-auto pt-6 text-center"},

          !premium && React.createElement("button",{onClick:openStripe,className:"mt-3 w-full h-[40px] rounded-[10px] bg-gradient-to-r from-amber-400 to-orange-600 text-white font-bold text-[13px]"},"Upgrade to Talk Everywhere")
        )
      )
    ),
    // UNLOCK MODAL
    showUnlock && React.createElement("div",{className:"fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm", onClick:e=>{if(e.target===e.currentTarget)setShowUnlock(false)}},
      React.createElement("div",{className:"w-full max-w-[420px] rounded-[16px] bg-[#111827] border border-[#22304a] overflow-hidden shadow-2xl"},
        React.createElement("div",{className:"px-6 py-5 border-b border-[#1e2a41] flex justify-between items-start"},
          React.createElement("div",null, React.createElement("h3",{className:"text-[18px] font-extrabold text-white"},"Unlock Full Access"), React.createElement("p",{className:"text-[12px] text-[#7a8aa6] mt-1"},"All 4 lounges + HF transceiver retunes")),
